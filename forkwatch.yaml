services:
  forkwatch:
    build: .
    image: forkwatch:2
    container_name: ForkWatch
    restart: unless-stopped
    ports:
      - "9999:8080"          # dashboard: http://NAS-IP:9999
    environment:
      TZ: Europe/Paris
    volumes:
      - /volume1/docker/forkwatch/data:/data      # settings, secrets, repository list, Git mirrors, .bundle archives, log
